name: Aquantia
description: >-
  Aquantia Corporation was a fabless semiconductor company headquartered in San Jose,
  California, that designed and marketed multi-gigabit Ethernet connectivity — AQtion
  client network controllers, Atlantic controllers, and multi-gig PHY transceivers for
  enterprise, data center, automotive, and consumer networking. Aquantia was acquired by
  Marvell Technology in 2019; the aquantia.com domain now redirects to marvell.com. It
  operated no public HTTP/developer API or developer portal — its published developer
  surface is silicon: Linux kernel and DPDK "Atlantic" NIC drivers, firmware, and tooling
  in the github.com/Aquantia organization. Retained in the API Evangelist network as a
  historical portfolio-lead stub; there is no API to enrich.
